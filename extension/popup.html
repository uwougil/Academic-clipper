<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Academic Clipper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Nature Paper Clipper</h1>
      <label for="bridge-token">Bridge token</label>
      <input id="bridge-token" type="password" autocomplete="off" placeholder="Paste token from bridge log">
      <button id="save" type="button">Save Paper</button>
      <button id="preview" class="secondary" type="button">Preview Markdown</button>
      <p id="status" role="status">Ready.</p>
      <pre id="debug" hidden></pre>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
