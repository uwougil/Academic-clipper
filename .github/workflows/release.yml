name: Release

on:
  pull_request:
    paths:
      - "release/**"
      - "scripts/package-release.mjs"
      - ".github/workflows/release.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package Windows release
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build release artifact
        run: node scripts/package-release.mjs
      - name: Verify artifact contents
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zip = "dist/release/Academic-clipper-v$version-windows.zip"
          if (-not (Test-Path $zip)) { throw "Missing $zip" }
          $names = tar -tf $zip
          foreach ($f in 'Install.cmd','install.ps1','uninstall.ps1','QUICKSTART.md','release-manifest.json','runtime/node.exe','extension/manifest.json','src/launcher.mjs','node_modules/defuddle/package.json') {
            if (-not ($names | Where-Object { $_ -like "*/$f" })) { throw "Artifact is missing $f" }
          }
          foreach ($s in 'install.ps1','uninstall.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "release/$s"), [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; throw "$s has syntax errors" }
          }
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: academic-clipper-windows
          path: dist/release/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: academic-clipper-windows
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" ./*.zip --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
