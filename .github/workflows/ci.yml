name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: CI / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 20
            label: Ubuntu / Node 20
          - os: ubuntu-latest
            node-version: 24
            label: Ubuntu / Node 24
          - os: windows-latest
            node-version: 24
            label: Windows / Node 24
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build extension
        run: npm run build
      - name: Check extension build
        run: node -e "if (!require('node:fs').existsSync('dist/extension/manifest.json')) process.exit(1)"
      - name: Validate golden paper
        run: npm run validate:paper -- --file ./papers/s41586-026-10401-1/index.md --citation-style auto
